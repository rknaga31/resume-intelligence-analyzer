name: CI — Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (dry-run)
        run: |
          echo "Docker build will run once backend/Dockerfile is created"
          # docker build ./backend --tag ria-backend:ci --no-cache

      - name: Build frontend image (dry-run)
        run: |
          echo "Docker build will run once frontend/Dockerfile is created"
          # docker build ./frontend --tag ria-frontend:ci --no-cache

      - name: Validate docker-compose (dry-run)
        run: |
          echo "docker compose config check will run once docker-compose.yml is created"
          # docker compose config
