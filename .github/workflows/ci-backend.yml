name: CI — Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "ml/**"
      - "tests/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "ml/**"
      - "tests/**"
      - ".github/workflows/ci-backend.yml"

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: ruff check backend/ ml/

      - name: Run ruff format check
        run: ruff format --check backend/ ml/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install mypy
          # TODO: pip install -r backend/requirements.txt when available

      - name: Run mypy
        run: |
          echo "mypy check will be enabled once backend/requirements.txt is created"
          # mypy backend/app ml/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ria_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: resume_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ria_user:testpassword@localhost:5432/resume_intelligence_test
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: test-secret-key-for-ci-only-not-real
      JWT_SECRET_KEY: test-jwt-secret-for-ci-only-not-real

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          echo "pip install will be enabled once backend/requirements.txt is created"
          pip install pytest pytest-asyncio pytest-cov
          # pip install -r backend/requirements.txt
          # pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: |
          echo "Tests will run once test files are added"
          # pytest tests/ --cov=backend/app --cov=ml --cov-report=xml -v

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
