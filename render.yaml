# =============================================================================
# Render.com Blueprint — Resume Intelligence Analyzer
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI
  # ---------------------------------------------------------------------------
  - type: web
    name: resume-intelligence-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8000
      - key: API_WORKERS
        value: 2
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your Vercel frontend URL in the Render dashboard
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: DATABASE_URL
        fromDatabase:
          name: resume-intelligence-db
          property: connectionString
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: ALLOWED_RESUME_TYPES
        value: pdf,docx,doc,txt
      # Add your LLM API keys in the Render dashboard (not here — keep them secret)
      # - key: OPENAI_API_KEY
      # - key: ANTHROPIC_API_KEY
      # - key: GOOGLE_API_KEY

  # ---------------------------------------------------------------------------
  # Database — PostgreSQL
  # ---------------------------------------------------------------------------
databases:
  - name: resume-intelligence-db
    databaseName: resume_intelligence
    user: ria_user
    plan: free
    region: oregon
